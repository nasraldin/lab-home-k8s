---
lab_cidr: "192.168.68.0/22"
lab_zone: "lab.nasraldin.com"
lab_short_zone: "lab" # Short LAN-only zone (gitlab.lab, grafana.lab, …)
# Local-only mail domain for Stalwart (info@dev.test, …).
# Stalwart rejects .lab; use RFC 6761 reserved TLD .test (or a real FQDN).
lab_mail_zone: "dev.test"
public_zone: "nasraldin.com"
gateway_ip: "192.168.68.1"
pve_ip: "192.168.68.13" # Proxmox hypervisor (not a guest VM)
adguard_ip: "192.168.68.10"
technitium_ip: "192.168.68.11"

# Guest LAN addresses (post-restructure 2026-07-30)
guest_ips:
  adguard-01: "192.168.68.10"
  dns-01: "192.168.68.11"
  infra-01: "192.168.68.14"
  gitlab-01: "192.168.68.15"
  runner-01: "192.168.68.16"
  k8s-cp-01: "192.168.68.17"
  k8s-w-01: "192.168.68.18"
  k8s-w-02: "192.168.68.19"
  k8s-w-03: "192.168.68.20"
  docker-01: "192.168.68.21"
  # Dockhand/Portainer publish on docker-01 after cutover (LXC 118/119 destroyed)
  dockhand: "192.168.68.21"
  portainer: "192.168.68.21"
  # ai-01 (VM 120) destroyed 2026-07-30 — Ollama primary is llm-01
  llm-01: "192.168.68.26"
  infisical-01: "192.168.68.25"

# Public HTTPS hostnames (Cloudflare proxied CNAME → tunnel)
public_urls:
  proxmox: "https://homelab.nasraldin.com"
  gitlab: "https://gitlab.nasraldin.com"
  registry: "https://registry.nasraldin.com"
  argo: "https://argo.nasraldin.com"
  harbor: "https://harbor.nasraldin.com"
  grafana: "https://grafana.nasraldin.com"
  keycloak: "https://id.nasraldin.com"
  longhorn: "https://longhorn.nasraldin.com"
  sonar: "https://sonar.nasraldin.com"
  n8n: "https://n8n.nasraldin.com"
  minio: "https://minio.nasraldin.com"
  s3: "https://s3.nasraldin.com"
  npm: "https://npm.nasraldin.com"
  proxy: "https://proxy.nasraldin.com"
  portainer: "https://portainer.nasraldin.com"
  dockhand: "https://docker.nasraldin.com"

# Cloudflare Tunnel ingress origins (LAN). Copy to cloudflare-tunnel bootstrap.
tunnel_origins:
  homelab: "https://127.0.0.1:8006"
  gitlab: "http://{{ guest_ips['gitlab-01'] }}:80"
  # Harbor is the lab container registry (not GitLab Omnibus :5050).
  registry: "http://{{ cilium_lb_ips.harbor }}:80"
  dockhand: "http://{{ guest_ips['docker-01'] }}:3000"
  argo: "http://{{ cilium_lb_ips.argocd }}:80"
  harbor: "http://{{ cilium_lb_ips.harbor }}:80"
  grafana: "http://{{ cilium_lb_ips.grafana }}:80"
  keycloak: "http://{{ cilium_lb_ips.keycloak }}:80"
  longhorn: "http://{{ cilium_lb_ips.longhorn }}:80"
  sonar: "http://{{ cilium_lb_ips.sonarqube }}:80"
  n8n: "http://{{ cilium_lb_ips.n8n }}:80"
  minio: "http://{{ guest_ips['docker-01'] }}:9001"
  s3: "http://{{ guest_ips['docker-01'] }}:9000"
  npm: "http://{{ cilium_lb_ips.verdaccio }}:80"
  proxy: "http://{{ guest_ips['docker-01'] }}:81"
  portainer: "https://{{ guest_ips['docker-01'] }}:9443"

# Hostnames that require Cloudflare Access OTP
tunnel_access_hostnames:
  - homelab.nasraldin.com
  - docker.nasraldin.com
  - longhorn.nasraldin.com
  - portainer.nasraldin.com
  - npm.nasraldin.com

# Reserved Cilium LoadBalancer IPs (lab-pool 192.168.68.100–119)
# Keep in sync with lab-home-gitops Helm values / lbipam annotations.
cilium_lb_ips:
  argocd: "192.168.68.100"
  harbor: "192.168.68.101"
  grafana: "192.168.68.102"
  keycloak: "192.168.68.103"
  longhorn: "192.168.68.104"
  librechat: "192.168.68.105"
  verdaccio: "192.168.68.106"
  n8n: "192.168.68.107"
  litellm: "192.168.68.108"
  otel: "192.168.68.110"
  sonarqube: "192.168.68.112"
  openclaw: "192.168.68.113"


# Short LAN URLs (*.lab) — HTTP direct to backends; public *.nasraldin.com unchanged (Cloudflare).
lab_urls:
  proxmox: "https://pve.lab:8006"
  gitlab: "http://gitlab.lab"
  registry: "http://harbor.lab"
  argo: "http://argo.lab"
  harbor: "http://harbor.lab"
  grafana: "http://grafana.lab"
  keycloak: "http://id.lab"
  longhorn: "http://longhorn.lab"
  # HTTP UIs are fronted by Proxy Manager on docker-01:80 (no ports in URLs).
  minio: "http://minio.lab"
  s3: "http://s3.lab:9000"
  npm: "http://npm.lab"
  proxy: "http://proxy.lab:81"
  mail: "http://mail.lab"
  stalwart: "http://mail.lab"
  webmail: "http://webmail.lab"
  inbox: "http://inbox.lab"
  portainer: "https://portainer.lab:9443"
  dockhand: "http://dockhand.lab"
  adguard: "http://adguard.lab"
  dns: "http://dns.lab"
  infisical: "http://infisical.lab"
  ollama: "http://ollama.lab:11434"
  ai: "http://ai.lab:11434"
  kube_api: "https://kube.lab:6443"
  n8n: "http://n8n.lab"
  librechat: "http://chat.lab"
  litellm: "http://litellm.lab"
  openclaw: "http://openclaw.lab"
  verdaccio: "http://npm.lab"
  sonar: "http://sonar.lab"


# Internal lab.nasraldin.com records (Technitium authoritative zone)
technitium_zone_records:
  - { name: "pve01", value: "{{ pve_ip }}" }
  - { name: "adguard-01", value: "{{ guest_ips['adguard-01'] }}" }
  - { name: "dns-01", value: "{{ guest_ips['dns-01'] }}" }
  - { name: "infra-01", value: "{{ guest_ips['infra-01'] }}" }
  - { name: "gitlab-01", value: "{{ guest_ips['gitlab-01'] }}" }
  - { name: "runner-01", value: "{{ guest_ips['runner-01'] }}" }
  - { name: "k8s-cp-01", value: "{{ guest_ips['k8s-cp-01'] }}" }
  - { name: "k8s-w-01", value: "{{ guest_ips['k8s-w-01'] }}" }
  - { name: "k8s-w-02", value: "{{ guest_ips['k8s-w-02'] }}" }
  - { name: "k8s-w-03", value: "{{ guest_ips['k8s-w-03'] }}" }
  - { name: "docker-01", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "dockhand", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "portainer", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "infisical-01", value: "{{ guest_ips['infisical-01'] }}" }
  - { name: "kube-api", value: "{{ guest_ips['k8s-cp-01'] }}" }
  - { name: "argo", value: "{{ cilium_lb_ips.argocd }}" }
  - { name: "harbor", value: "{{ cilium_lb_ips.harbor }}" }
  - { name: "grafana", value: "{{ cilium_lb_ips.grafana }}" }
  - { name: "id", value: "{{ cilium_lb_ips.keycloak }}" }
  - { name: "longhorn", value: "{{ cilium_lb_ips.longhorn }}" }
  - { name: "minio", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "s3", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "gateway", value: "{{ gateway_ip }}" }

# Short *.lab zone — friendly LAN names
technitium_short_zone_records:
  - { name: "pve", value: "{{ pve_ip }}" }
  - { name: "proxmox", value: "{{ pve_ip }}" }
  - { name: "infra", value: "{{ guest_ips['infra-01'] }}" }
  - { name: "gitlab", value: "{{ guest_ips['gitlab-01'] }}" }
  - { name: "registry", value: "{{ guest_ips['gitlab-01'] }}" }
  - { name: "runner", value: "{{ guest_ips['runner-01'] }}" }
  - { name: "kube", value: "{{ guest_ips['k8s-cp-01'] }}" }
  - { name: "argo", value: "{{ cilium_lb_ips.argocd }}" }
  - { name: "harbor", value: "{{ cilium_lb_ips.harbor }}" }
  - { name: "grafana", value: "{{ cilium_lb_ips.grafana }}" }
  - { name: "id", value: "{{ cilium_lb_ips.keycloak }}" }
  - { name: "keycloak", value: "{{ cilium_lb_ips.keycloak }}" }
  - { name: "longhorn", value: "{{ cilium_lb_ips.longhorn }}" }
  - { name: "minio", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "s3", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "npm", value: "{{ cilium_lb_ips.verdaccio }}" }
  - { name: "verdaccio", value: "{{ cilium_lb_ips.verdaccio }}" }
  - { name: "proxy", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "mail", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "stalwart", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "webmail", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "inbox", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "portainer", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "dockhand", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "docker", value: "{{ guest_ips['docker-01'] }}" }
  # AdGuard / Technitium / Infisical UIs → NPM on docker-01 (port 80, no :3000/:5380/:8090)
  - { name: "adguard", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "dns", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "technitium", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "infisical", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "ollama", value: "{{ guest_ips['llm-01'] }}" }
  - { name: "ai", value: "{{ guest_ips['llm-01'] }}" }
  - { name: "llm", value: "{{ guest_ips['llm-01'] }}" }
  - { name: "n8n", value: "{{ cilium_lb_ips.n8n }}" }
  # AI/chat UIs → Proxy Manager on docker-01 so http://*.lab works without :ports
  - { name: "librechat", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "chat", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "litellm", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "openclaw", value: "{{ guest_ips['docker-01'] }}" }
  - { name: "sonar", value: "{{ cilium_lb_ips.sonarqube }}" }
  - { name: "sonarqube", value: "{{ cilium_lb_ips.sonarqube }}" }
  - { name: "gateway", value: "{{ gateway_ip }}" }

# Technitium zones managed by ansible/roles/technitium_dns
# Record fields: name (@ = zone apex), type (A|MX, default A), value (A), exchange+preference (MX)
technitium_managed_zones:
  - zone: "{{ lab_zone }}"
    records: "{{ technitium_zone_records }}"
  - zone: "{{ lab_short_zone }}"
    records: "{{ technitium_short_zone_records }}"
  - zone: "{{ lab_mail_zone }}"
    records: "{{ technitium_mail_zone_records }}"

# A/MX for local mail domain (Stalwart on docker-01; UI still at http://mail.lab)
technitium_mail_zone_records:
  - { name: "@", type: A, value: "{{ guest_ips['docker-01'] }}" }
  - { name: "@", type: MX, exchange: "mail.{{ lab_mail_zone }}", preference: 10 }
  - { name: "mail", type: A, value: "{{ guest_ips['docker-01'] }}" }
  - { name: "autoconfig", type: A, value: "{{ guest_ips['docker-01'] }}" }
  - { name: "autodiscover", type: A, value: "{{ guest_ips['docker-01'] }}" }

# Kubernetes — single control plane (no HAProxy)
k8s_version: "1.36"
k8s_version_package: "1.36.*"
pod_network_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"
control_plane_endpoint: "{{ guest_ips['k8s-cp-01'] }}:6443"
lab_dns: "{{ adguard_ip }}"
cilium_lb_pool_cidrs:
  - "192.168.68.100-192.168.68.119"
# Do NOT set ansible_user here — it overrides LXC groups that need root
# (dns-01, adguard-01, infisical-01, infra-01, llm-01). Per-group/host
# ansible_user lives in inventory/hosts.yml and host_vars/*.yml.

adguard_admin_user: admin
adguard_admin_password: "{{ vault_adguard_admin_password }}"
technitium_admin_password: "{{ vault_technitium_admin_password }}"

# GitLab Omnibus — public URLs set before first reconfigure (TLS at Cloudflare)
# GitLab Omnibus — LAN HTTP primary (*.lab). Public HTTPS is Cloudflare Tunnel → this origin.
gitlab_external_url: "{{ lab_urls.gitlab }}"
gitlab_registry_external_url: "http://registry.lab:{{ gitlab_registry_listen_port | default(5050) }}"
gitlab_object_store_endpoint: "http://{{ guest_ips['docker-01'] }}:9000"

# Argo CD bootstrap (install-argocd.sh)
argocd_public_url: "{{ public_urls.argo }}"
argocd_hostname: "argo.nasraldin.com"
argocd_lb_ip: "{{ cilium_lb_ips.argocd }}"

# Harbor / Grafana (lab-home-gitops Helm values reference these)
harbor_external_url: "{{ public_urls.harbor }}"
harbor_lb_ip: "{{ cilium_lb_ips.harbor }}"
grafana_public_url: "{{ public_urls.grafana }}"
grafana_hostname: "grafana.nasraldin.com"
grafana_lb_ip: "{{ cilium_lb_ips.grafana }}"

# Keycloak (lab-home-gitops Helm values reference these)
keycloak_public_url: "{{ public_urls.keycloak }}"
keycloak_hostname: "id.nasraldin.com"
keycloak_lb_ip: "{{ cilium_lb_ips.keycloak }}"

# AIStor / MinIO (docker-01 — console + S3 API public, GitLab uses LAN :9000)
aistor_public_console_url: "{{ public_urls.minio }}"
aistor_public_s3_url: "{{ public_urls.s3 }}"
aistor_browser_redirect_url: "{{ public_urls.minio }}"
aistor_server_url: "{{ public_urls.s3 }}"

# Portainer on docker-01
portainer_public_url: "{{ public_urls.portainer }}"
