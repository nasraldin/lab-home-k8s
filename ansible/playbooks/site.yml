---
- name: DNS (AdGuard + Technitium LXCs)
  ansible.builtin.import_playbook: dns.yml

- name: Infisical dedicated LXC
  ansible.builtin.import_playbook: infisical.yml

- name: Docker app host (proxy, mail, tools, Dockhand, Portainer, AIStor)
  ansible.builtin.import_playbook: docker-hosts.yml

- name: Jumpbox (after VM→LXC cutover)
  ansible.builtin.import_playbook: infra.yml

- name: Register Dockhand environments (API) on docker-01
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for Dockhand HTTP on docker-01
      ansible.builtin.uri:
        url: http://192.168.68.21:3000/
        status_code: [200, 302, 401]
      register: dockhand_http
      retries: 12
      delay: 5
      until: dockhand_http is succeeded
      ignore_errors: true

    - name: Register environments + mint Hawser tokens
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../scripts/dockhand-register-environments.py"
      register: dockhand_reg
      changed_when: "'wrote' in (dockhand_reg.stdout | default('')) or 'created' in (dockhand_reg.stdout | default(''))"
      when: dockhand_http is succeeded
      ignore_errors: true

- name: Dockhand Hawser agents
  ansible.builtin.import_playbook: dockhand-agents.yml

- name: GitLab platform
  ansible.builtin.import_playbook: gitlab.yml

- name: Kubernetes cluster
  ansible.builtin.import_playbook: k8s.yml

