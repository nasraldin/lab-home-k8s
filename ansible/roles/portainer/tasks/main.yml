---
- name: Ensure Docker available on Portainer host
  ansible.builtin.include_role:
    name: docker_host
  when: ansible_facts['os_family'] == 'Debian'

- name: Require Portainer admin password
  ansible.builtin.assert:
    that:
      - vault_portainer_admin_password is defined
      - portainer_admin_password | length >= 16
      - "'replace-with' not in portainer_admin_password"
    fail_msg: >-
      Set vault_portainer_admin_password in secrets.yml (min 16 chars).
  no_log: true

- name: Create Portainer directory
  ansible.builtin.file:
    path: "{{ portainer_compose_dir }}"
    state: directory
    mode: "0750"

- name: Generate Portainer admin bcrypt hash
  ansible.builtin.command:
    cmd: >-
      docker run --rm httpd:2.4-alpine
      htpasswd -nbB -C 5 admin {{ portainer_admin_password | quote }}
  register: portainer_htpasswd
  changed_when: false
  no_log: true

- name: Parse Portainer admin password hash
  ansible.builtin.set_fact:
    portainer_admin_password_hash: "{{ portainer_htpasswd.stdout.split(':')[1] | trim }}"
  no_log: true

- name: Deploy Portainer compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ portainer_compose_dir }}/compose.yaml"
    mode: "0640"
  no_log: true

- name: Start Portainer
  ansible.builtin.command:
    cmd: docker compose -f {{ portainer_compose_dir }}/compose.yaml up -d
  args:
    chdir: "{{ portainer_compose_dir }}"
  register: portainer_up
  changed_when: >-
    'Started' in portainer_up.stderr
    or 'Created' in portainer_up.stderr
    or 'Running' in portainer_up.stderr

- name: Hint — add Docker endpoints in Portainer UI
  ansible.builtin.debug:
    msg: >-
      Open {{ portainer_public_url }} (or http://portainer.lab) as admin
      with vault_portainer_admin_password; add environments for docker-01
      (192.168.68.21) and other Docker hosts as needed.
