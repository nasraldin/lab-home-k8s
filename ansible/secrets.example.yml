---
# Copy to secrets.yml (gitignored) and set strong passwords:
#   cp secrets.example.yml secrets.yml
#
# After Infisical is up (infisical-01:8090), seed projects/folders/secrets:
#   ansible-playbook playbooks/infisical-seed.yml -e @secrets.yml
# Seed map: files/infisical/seed-map.yaml
# Projects: infra | pipelines | kubernetes | apps

# --- DNS (adguard-01 / dns-01) -----------------------------------------------
vault_adguard_admin_password: "replace-with-strong-password"
vault_technitium_admin_password: "replace-with-strong-password"
vault_technitium_api_token: ""

# --- AIStor (docker-01) ------------------------------------------------------
vault_aistor_root_user: "aistoradmin"
vault_aistor_root_password: "replace-with-strong-password"
vault_gitlab_s3_access_key: "gitlab-s3"
vault_gitlab_s3_secret_key: "replace-with-strong-password"
vault_elastic_s3_access_key: "elastic-s3"
vault_elastic_s3_secret_key: "replace-with-strong-password"
# From: mc admin prometheus generate local (on aistor host)
vault_aistor_prometheus_bearer: ""

# --- HashiCorp Vault (practice lab / optional) -------------------------------
vault_root_token: ""

# --- Central Postgres / Redis / MariaDB --------------------------------------
vault_postgres_user: "postgres"
vault_postgres_password: "replace-with-strong-password-16chars"
vault_pgadmin_email: "admin@lab.nasraldin.com"
vault_pgadmin_password: "replace-with-strong-password"
vault_redis_password: "replace-with-strong-password"
vault_mariadb_root_password: "replace-with-strong-password"

# App DB passwords (created by postgres init)
vault_keycloak_db_password: "replace-with-strong-password-16chars"
vault_sonarqube_db_password: "replace-with-strong-password-16chars"

# --- Infisical (infisical-01) — secrets platform itself ----------------------
# openssl rand -hex 16          → vault_infisical_encryption_key
# openssl rand -base64 32       → vault_infisical_auth_secret
vault_infisical_encryption_key: "replace-with-openssl-rand-hex-16"
vault_infisical_auth_secret: "replace-with-openssl-rand-base64-32"
vault_infisical_postgres_user: "infisical"
vault_infisical_postgres_password: "replace-with-strong-password-16chars"
vault_infisical_postgres_db: "infisical"
vault_infisical_url: "http://192.168.68.25:8090"
vault_infisical_smtp_host: ""
vault_infisical_smtp_port: "587"
vault_infisical_smtp_username: ""
vault_infisical_smtp_password: ""
vault_infisical_smtp_from_address: ""
vault_infisical_smtp_from_name: "Infisical"
# Day-2: after POST /api/v1/admin/bootstrap + Universal Auth client secret
# (never commit real values). K8s Secret: security/infisical-universal-auth
vault_infisical_admin_email: "admin@lab.nasraldin.com"
vault_infisical_admin_password: "replace-with-strong-password"
vault_infisical_ua_client_id: "replace-after-bootstrap-ua-client-id"
vault_infisical_ua_client_secret: "replace-after-bootstrap-ua-client-secret"
vault_infisical_org_id: ""
vault_infisical_identity_id: ""

# --- Nginx Proxy Manager -----------------------------------------------------
vault_proxy_admin_email: "admin@lab.nasraldin.com"
vault_proxy_admin_password: "replace-with-strong-password"

# --- Portainer (docker-01) — baked admin avoids 5-minute init timeout --------
vault_portainer_admin_password: "replace-with-strong-password-16chars"

# Stalwart (mail) — automated bootstrap (no wizard)
# https://stalw.art/docs/install/platform/docker/
# Domain is lab_mail_zone (dev.test). UI: http://mail.lab/admin
vault_stalwart_recovery_password: "replace-with-strong-password-16chars"
vault_stalwart_admin_password: "replace-with-strong-password"
vault_stalwart_mailbox_password: "replace-with-strong-password"
# Bulwark webmail session cookie encryption (http://webmail.lab)
vault_bulwark_session_secret: "replace-with-random-32chars-secret"

# --- Keycloak (in-cluster via GitOps — id.nasraldin.com) ---------------------
vault_keycloak_admin_user: "admin"
vault_keycloak_admin_password: "replace-with-strong-password"
vault_keycloak_hostname: "https://id.nasraldin.com"

# --- Harbor (in-cluster) -----------------------------------------------------
vault_harbor_admin_password: "replace-with-strong-password"
vault_harbor_registry: "harbor.nasraldin.com"
vault_harbor_robot_user: "robot$ci"
vault_harbor_robot_password: "replace-with-strong-password"

# --- SonarQube ---------------------------------------------------------------
vault_sonarqube_system_passcode: "replace-with-strong-passcode"

# --- Grafana / observability -------------------------------------------------
vault_grafana_admin_password: "replace-with-strong-password"
vault_litellm_master_key: "replace-with-strong-password"

# --- Elastic / Kibana (optional guests) --------------------------------------
vault_elastic_password: "replace-with-strong-password-16chars"
vault_kibana_system_password: "replace-with-strong-password-16chars"

# Optional Proxmox exporter
vault_pve_exporter_user: "monitoring@pve"
vault_pve_exporter_token_name: "exporter"
vault_pve_exporter_token: ""

# --- GitLab Omnibus ----------------------------------------------------------
vault_gitlab_root_password: "replace-with-strong-password"
vault_gitlab_runner_token: ""
vault_gitlab_runner_tokens:
  runner-01: ""

# --- Pipelines: Cosign (optional until supply-chain phase) -------------------
# cosign generate-key-pair  → store private in Infisical pipelines/cosign
vault_cosign_password: ""
vault_cosign_private_key: ""
vault_cosign_public_key: ""

# Only if a CI job must kubectl/helm outside Argo GitOps (usually leave empty)
vault_pipeline_kubeconfig: ""

# --- Apps (optional until AI clients need dedicated secrets) -----------------
vault_n8n_encryption_key: ""
vault_librechat_creds_key: ""
vault_librechat_creds_iv: ""
vault_librechat_jwt_secret: ""
vault_librechat_jwt_refresh_secret: ""
vault_librechat_meili_master_key: ""
# Initial LibreChat admin (ALLOW_REGISTRATION=false; seed Job uses create-user)
vault_librechat_admin_email: ""
vault_librechat_admin_password: ""

# OpenClaw gateway UI token (Control UI #token= fragment + NPM /__oc_boot bootstrap)
vault_openclaw_gateway_token: "replace-with-random-hex"
