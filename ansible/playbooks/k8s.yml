---
- name: Prepare Kubernetes nodes
  hosts: k8s_nodes
  become: true
  roles:
    - k8s_common
    - k8s_containerd
    - k8s_packages

- name: Initialize single control plane
  hosts: k8s-cp-01
  become: true
  roles:
    - k8s_kubeadm

- name: Join workers
  hosts: k8s_workers
  become: true
  roles:
    - k8s_kubeadm
  tasks:
    - name: Install Longhorn node prerequisites
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true
    - name: Enable and start iscsid
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true

- name: Label worker nodes
  hosts: k8s-cp-01
  roles:
    - k8s_node_labels

- name: Install etcd backup cron on control plane
  hosts: k8s_control_plane
  become: true
  pre_tasks:
    - name: Install etcdctl client when available
      ansible.builtin.apt:
        name: etcd-client
        state: present
        update_cache: true
      failed_when: false
  roles:
    - k8s_etcd_backup
