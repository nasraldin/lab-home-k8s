---
# Nodes stay NotReady until Cilium (make bootstrap). Wait for join only.
- name: Wait until worker nodes are registered
  ansible.builtin.command: kubectl get node {{ item }} -o jsonpath='{.metadata.name}'
  register: k8s_node_registered
  until: k8s_node_registered.stdout == item
  retries: 30
  delay: 10
  loop: "{{ groups['k8s_workers'] }}"
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ k8s_admin_user }}/.kube/config"

- name: Apply workload labels on workers
  ansible.builtin.command: >
    kubectl label node {{ item }}
    {% for key, value in hostvars[item].k8s_node_labels.items() %}{{ key }}={{ value }}{% endfor %}
    --overwrite
  loop: "{{ groups['k8s_workers'] }}"
  register: k8s_label_result
  changed_when: "'labeled' in k8s_label_result.stdout"
  environment:
    KUBECONFIG: "/home/{{ k8s_admin_user }}/.kube/config"
