---
- name: Require NPM initial admin credentials
  ansible.builtin.assert:
    that:
      - vault_npm_admin_email is defined
      - vault_npm_admin_email | length > 3
      - "'@' in vault_npm_admin_email"
      - vault_npm_admin_password is defined
      - vault_npm_admin_password | length >= 12
    fail_msg: >-
      Set vault_npm_admin_email and vault_npm_admin_password in secrets.yml
      (NPM Auto Initial User Creation).
  no_log: true

- name: Create NPM directory
  ansible.builtin.file:
    path: "{{ npm_compose_dir }}"
    state: directory
    mode: "0750"

- name: Deploy NPM compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ npm_compose_dir }}/compose.yaml"
    mode: "0640"
  no_log: true

- name: Pull NPM images (retry on registry timeouts)
  ansible.builtin.command:
    cmd: docker compose -f {{ npm_compose_dir }}/compose.yaml pull
  args:
    chdir: "{{ npm_compose_dir }}"
  register: npm_pull
  retries: 5
  delay: 15
  until: npm_pull.rc == 0
  changed_when: false

- name: Start NPM
  ansible.builtin.command:
    cmd: docker compose -f {{ npm_compose_dir }}/compose.yaml up -d
  args:
    chdir: "{{ npm_compose_dir }}"
  register: npm_up
  retries: 5
  delay: 15
  until: npm_up.rc == 0
  changed_when: "'Started' in npm_up.stderr or 'Created' in npm_up.stderr or 'Running' in npm_up.stderr"
