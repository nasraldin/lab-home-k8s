---
proxy_compose_dir: /opt/proxy
proxy_image: "jc21/nginx-proxy-manager:2.12.3"
# Set via secrets.yml — Auto Initial User Creation
# https://nginxproxymanager.com/advanced-config/#auto-initial-user-creation
# Prefer vault_proxy_*; vault_npm_* kept as fallback during rename.
proxy_initial_admin_email: "{{ vault_proxy_admin_email | default(vault_npm_admin_email) }}"
proxy_initial_admin_password: "{{ vault_proxy_admin_password | default(vault_npm_admin_password) }}"

proxy_manager_url: "http://127.0.0.1:81"

# HTTP UIs published as http://name.lab (port 80 via this proxy). DNS A → docker-01.
proxy_lab_hosts:
  - domains: ["chat.lab", "librechat.lab"]
    forward_host: "{{ cilium_lb_ips.librechat }}"
    forward_port: 3080
  - domains: ["litellm.lab"]
    forward_host: "{{ cilium_lb_ips.litellm }}"
    forward_port: 4000
  # OpenClaw: WebSocket upgrade on; Control UI auth via official #token= fragment
  # bootstrap (https://docs.openclaw.ai/web/dashboard). Token from vault only —
  # never commit the rendered advanced_config.
  #
  # IMPORTANT: Do not unconditionally 302 `/` → `/__oc_boot`. That loops forever:
  # boot does location.replace("/#token=…"), browser re-requests `/` (fragment not
  # sent), NPM 302s again (browser keeps #token on `/__oc_boot`), and WS upgrades
  # to `/` never reach the gateway. Skip redirect for Upgrade: websocket and after
  # the oc_boot cookie set by the boot page.
  - domains: ["openclaw.lab"]
    forward_host: "{{ cilium_lb_ips.openclaw }}"
    forward_port: 18789
    advanced_config: |
      # Official dashboard token bootstrap (URL fragment; not sent to upstream).
      # Bare / → /__oc_boot (once) → /#token=…; then `/` + WS proxy normally.
      set $oc_boot_redirect 0;
      if ($request_uri = "/") {
        set $oc_boot_redirect 1;
      }
      if ($http_upgrade = "websocket") {
        set $oc_boot_redirect 0;
      }
      if ($cookie_oc_boot = "1") {
        set $oc_boot_redirect 0;
      }
      if ($oc_boot_redirect = 1) {
        return 302 /__oc_boot;
      }
      location = /__oc_boot {
        default_type text/html;
        charset utf-8;
        add_header Set-Cookie "oc_boot=1; Path=/; SameSite=Lax" always;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>OpenClaw</title><script>location.replace("/#token={{ vault_openclaw_gateway_token }}");</script></head><body>Connecting…</body></html>';
      }
  - domains: ["webmail.lab", "inbox.lab"]
    forward_host: "bulwark"
    forward_port: 3000
  - domains: ["adguard.lab"]
    forward_host: "{{ guest_ips['adguard-01'] }}"
    forward_port: 3000
  - domains: ["dns.lab", "technitium.lab"]
    forward_host: "{{ guest_ips['dns-01'] }}"
    forward_port: 5380
  - domains: ["infisical.lab"]
    forward_host: "{{ guest_ips['infisical-01'] }}"
    forward_port: 8090
  # Host-published ports: NPM runs on the `proxy` bridge, so 127.0.0.1 is the
  # NPM container itself (not docker-01). Use the LAN IP (hairpin works).
  - domains: ["minio.lab"]
    forward_host: "{{ guest_ips['docker-01'] }}"
    forward_port: 9001
  - domains: ["dockhand.lab", "docker.lab"]
    forward_host: "{{ guest_ips['docker-01'] }}"
    forward_port: 3000
  - domains: ["portainer.lab"]
    forward_host: "{{ guest_ips['docker-01'] }}"
    forward_port: 9443
    forward_scheme: https
    # Portainer serves HTTPS with a self-signed cert on :9443.
    advanced_config: |
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
