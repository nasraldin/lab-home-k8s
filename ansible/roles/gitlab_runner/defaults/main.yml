---
# Register against the LAN origin. Public HTTPS (Tunnel) can return 530 before
# the CF connector is healthy; runners on the lab VLAN do not need the public URL.
gitlab_runner_url: "http://{{ hostvars['gitlab-01'].ansible_host | default('192.168.68.14') }}"
gitlab_runner_name: "{{ inventory_hostname }}-docker"
gitlab_runner_executor: docker
gitlab_runner_docker_image: "alpine:latest"
gitlab_runner_tags:
  - "{{ inventory_hostname }}"
gitlab_runner_run_untagged: true
gitlab_runner_privileged: false
# Prefer minted token file fetched from gitlab-01; fall back to secrets.yml
gitlab_runner_token: "{{ vault_gitlab_runner_tokens[inventory_hostname] | default(vault_gitlab_runner_token) | default('') }}"
gitlab_runner_minted_token_path: "/etc/gitlab/ansible-runner-tokens/{{ gitlab_runner_name }}.token"
gitlab_runner_config_path: /etc/gitlab-runner/config.toml
gitlab_runner_concurrent: 4
# Prometheus metrics for Grafana (GitLab Runner dashboards)
gitlab_runner_metrics_listen_address: ":9252"

# Distributed cache on AIStor (shared across runners)
gitlab_runner_cache_enabled: true
gitlab_runner_cache_type: s3
gitlab_runner_cache_shared: true
gitlab_runner_cache_s3_server: "192.168.68.10:9000"
gitlab_runner_cache_s3_bucket: runner-cache
gitlab_runner_cache_s3_access_key: "{{ vault_gitlab_s3_access_key }}"
gitlab_runner_cache_s3_secret_key: "{{ vault_gitlab_s3_secret_key }}"
gitlab_runner_cache_s3_bucket_location: us-east-1
gitlab_runner_cache_s3_insecure: true
